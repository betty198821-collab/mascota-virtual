<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error 404</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="menu-page">

  <!--
    Fondo del menú: tu póster/banner. Ponelo en la carpeta images/ con el nombre
    menu_background.png (también sirve .jpg o .webp). Ver README.
  -->
  <div class="menu-bg" aria-hidden="true"></div>

  <main class="menu-content">
    <h1 class="menu-title" id="menuTitle">Error <span class="glitch-text" data-text="404">404</span></h1>

    <nav class="menu-buttons">
      <button type="button" class="menu-btn" id="startBtn">Empezar</button>
      <button type="button" class="menu-btn menu-btn-secondary" id="settingsBtn">Configuración</button>
    </nav>
  </main>

  <!-- Panel de configuración -->
  <div class="modal-overlay" id="settingsOverlay" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle">Configuración</h2>

      <div class="setting-group">
        <h3 id="langLabel">Idioma</h3>
        <div class="segmented" role="radiogroup" aria-labelledby="langLabel">
          <button type="button" class="seg-btn" role="radio" data-lang="es">Español</button>
          <button type="button" class="seg-btn" role="radio" data-lang="en">English</button>
        </div>
        <p class="setting-note" id="langNote"></p>
      </div>

      <div class="setting-group">
        <h3 id="voiceLabel">Voz de las mascotas</h3>
        <div class="segmented" role="radiogroup" aria-labelledby="voiceLabel">
          <button type="button" class="seg-btn" role="radio" data-voice="on" id="voiceOnBtn">Activar las voces</button>
          <button type="button" class="seg-btn" role="radio" data-voice="off" id="voiceOffBtn">Desactivar las voces</button>
        </div>
        <p class="setting-note" id="voiceNote"></p>
      </div>

      <div class="setting-group">
        <h3 id="soundLabel">Sonido de mensajes</h3>
        <div class="segmented" role="radiogroup" aria-labelledby="soundLabel">
          <button type="button" class="seg-btn" role="radio" data-sound="on" id="soundOnBtn">Sonido activado</button>
          <button type="button" class="seg-btn" role="radio" data-sound="off" id="soundOffBtn">Sonido desactivado</button>
        </div>
      </div>

      <button type="button" class="menu-btn" id="testVoiceBtn">Probar voz</button>
      <button type="button" class="menu-btn" id="closeSettingsBtn">Cerrar</button>
    </section>
  </div>

<script src="js/translate.js"></script>
<script src="js/audio.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
